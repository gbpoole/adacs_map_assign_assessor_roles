[project]
name = "assign-reviewers"
version = "0.1.0"
description = "Assign lead and co-assessors to proposals, avoiding conflicts."
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assign-reviewers = "assign_reviewers.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assign_reviewers"]
